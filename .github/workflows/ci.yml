name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + no data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fail if data files or secrets are tracked
        run: |
          tracked=$(git ls-files | grep -E '\.(csv|parquet)$|(^|/)\.env$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Data files or secrets are tracked by git:"
            echo "$tracked"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
