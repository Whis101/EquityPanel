[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitypanel"
dynamic = ["version"]
description = "Audit clinical risk models for performance gaps across demographic groups."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dave Brown" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/equitypanel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/equitypanel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the real UCI/Synthea files in data/raw",
]
