[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitypanel"
dynamic = ["version"]
description = "Measure performance gaps of clinical risk models across demographic groups. For research and education; not for clinical use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dave Brown" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
model = [
    "scikit-learn>=1.4",  # the baseline model in equitypanel.model
]
report = [
    "matplotlib>=3.8",  # charts in equitypanel.reclassification.plot and equitypanel.report
    "jinja2>=3.1",  # the HTML report template (autoescaped)
]
llm = [
    "anthropic>=1.0",  # the optional checked summary in equitypanel.report.summary
    "python-dotenv>=1.0",  # reads ANTHROPIC_API_KEY from .env in scripts/build_report.py
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.4",  # test-only answer key for the hand-written AUC
    "matplotlib>=3.8",  # so the chart tests run in CI
    "jinja2>=3.1",
    "anthropic>=1.0",  # tests use a fake client; nothing calls the API
    "python-dotenv>=1.0",
]

[tool.hatch.version]
path = "src/equitypanel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/equitypanel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the real UCI/Synthea files in data/raw",
]
